<script>
  window.supabaseAuth = (() => {
    const SUPABASE_URL = 'https://vpsehljhihkwruqeanod.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwc2VobGpoaWhrd3J1cWVhbm9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5ODk4MDksImV4cCI6MjEwNDU2NTgwOX0.tqcnLhwjvN8snqHFGsi8rs687_32B0nufU0ReFk-3nw';

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    async function signInWithGoogle() {
      const { data, error } = await client.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + window.location.pathname
        }
      });
      if (error) throw error;
      return data;
    }

    async function signOut() {
      const { error } = await client.auth.signOut();
      if (error) throw error;
    }

    function syncUser(user) {
      if (!window.state) return;
      if (!user) {
        window.state.user = { name: 'Guest Observer', handle: 'guest-observer', signed: false };
        return;
      }

      const metadata = user.user_metadata || {};
      const name = metadata.full_name || metadata.name || user.email?.split('@')[0] || 'Google User';
      const handle = (metadata.user_name || user.email?.split('@')[0] || 'google-user')
        .replace(/[^a-z0-9-]/gi, '-')
        .toLowerCase();

      window.state.user = {
        name,
        handle,
        email: user.email || '',
        photoURL: metadata.avatar_url || metadata.picture || '',
        uid: user.id,
        signed: true
      };
    }

    async function hydrate() {
      const { data: { session }, error } = await client.auth.getSession();
      if (error) {
        console.error('Supabase session error:', error);
        return;
      }
      syncUser(session?.user || null);

      client.auth.onAuthStateChange((_event, nextSession) => {
        syncUser(nextSession?.user || null);
        if (typeof window.updateAuthUI === 'function') window.updateAuthUI();
      });
    }

    return { client, hydrate, signInWithGoogle, signOut, syncUser };
  })();

  window.updateAuthUI = function () {
    const loginButton = document.querySelector('[data-auth="login"]');
    const signupButton = document.querySelector('[data-auth="signup"]');
    const userChip = document.getElementById('userChip');
    const chipName = document.getElementById('chipName');
    const chipAv = document.getElementById('chipAv');
    const popName = document.getElementById('popName');
    const popHdl = document.getElementById('popHdl');
    const popAv = document.getElementById('popAv');

    if (!window.state) return;

    if (window.state.user && window.state.user.signed) {
      if (loginButton) loginButton.style.display = 'none';
      if (signupButton) signupButton.style.display = 'none';
      if (userChip) userChip.classList.add('on');
      if (chipName) chipName.textContent = window.state.user.name;
      if (chipAv) chipAv.textContent = (window.state.user.name || 'G').charAt(0).toUpperCase();
      if (popName) popName.textContent = window.state.user.name;
      if (popHdl) popHdl.textContent = '@' + (window.state.user.handle || 'user');
      if (popAv) popAv.textContent = (window.state.user.name || 'G').charAt(0).toUpperCase();
    } else {
      if (loginButton) loginButton.style.display = '';
      if (signupButton) signupButton.style.display = '';
      if (userChip) userChip.classList.remove('on');
      if (chipName) chipName.textContent = 'Guest';
      if (chipAv) chipAv.textContent = 'G';
      if (popName) popName.textContent = 'Guest Observer';
      if (popHdl) popHdl.textContent = '@guest-observer';
      if (popAv) popAv.textContent = 'G';
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    const googleBtn = document.querySelector('[data-oauth="Google"]');
    if (googleBtn) {
      googleBtn.addEventListener('click', async () => {
        try {
          googleBtn.disabled = true;
          const originalText = googleBtn.textContent;
          googleBtn.textContent = 'Connecting…';
          await window.supabaseAuth.signInWithGoogle();
          const authOverlay = document.getElementById('ovAuth');
          if (authOverlay) authOverlay.classList.remove('open');
          toast('Signed in with Google', 'check');
        } catch (error) {
          console.error('Google auth failed:', error);
          const message = error?.message || 'Google sign-in failed';
          toast(message, 'alert-circle');
        } finally {
          googleBtn.disabled = false;
          googleBtn.textContent = googleBtn.dataset.originalText || 'Google';
        }
      });
      googleBtn.dataset.originalText = googleBtn.textContent;
    }

    const userChip = document.getElementById('userChip');
    if (userChip) {
      userChip.addEventListener('click', async () => {
        if (!window.state || !window.state.user || !window.state.user.signed) return;
        const shouldLogout = confirm(`Sign out ${window.state.user.name}?`);
        if (!shouldLogout) return;
        try {
          await window.supabaseAuth.signOut();
          const profilePop = document.getElementById('profilePop');
          if (profilePop) profilePop.classList.remove('open');
          toast('Signed out', 'check');
        } catch (error) {
          console.error('Sign-out failed:', error);
          toast('Could not sign out', 'alert-circle');
        }
      });
    }

    if (window.supabaseAuth && typeof window.supabaseAuth.hydrate === 'function') {
      window.supabaseAuth.hydrate();
    }
  });
</script>

function toast(msg, ic='check'){
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`<i data-lucide="${ic}" class="ic"></i><span>${msg}</span>`;
