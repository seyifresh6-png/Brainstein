<script>
  window.BRAINSTEIN_CONFIG = window.BRAINSTEIN_CONFIG || {
    supabaseUrl: 'https://vpsehljhihkwruqeanod.supabase.co',
    supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwc2VobGpoaWhrd3J1cWVhbm9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5ODk4MDksImV4cCI6MjEwNDU2NTgwOX0.tqc8vTgAfuY2x0VvM63n58s1wD7f9sh7slTQ0H4w4-Q'
  };

  function safeText(value, fallback = 'Guest') {
    if (value === null || value === undefined || !String(value).trim()) return fallback;
    return String(value).trim();
  }

  function ensureBaseState() {
    const fallbackState = {
      user: {
        name: 'Guest Observer',
        handle: 'guest-observer',
        signed: false,
        avatar: 'G',
        email: ''
      },
      view: 'home',
      channel: 'homework',
      theme: 'dark',
      lib: { q: '', cat: 'All', type: 'All' },
      peerUsed: {}
    };

    if (!window.state || typeof window.state !== 'object') {
      window.state = {
        ...fallbackState,
        user: { ...fallbackState.user },
        lib: { ...fallbackState.lib },
        peerUsed: { ...fallbackState.peerUsed }
      };
    } else {
      window.state = {
        ...fallbackState,
        ...window.state,
        user: {
          ...fallbackState.user,
          ...(window.state.user || {})
        },
        lib: {
          ...fallbackState.lib,
          ...(window.state.lib || {})
        },
        peerUsed: {
          ...fallbackState.peerUsed,
          ...(window.state.peerUsed || {})
        }
      };
    }

    if (!window.state.user || typeof window.state.user !== 'object') {
      window.state.user = { ...fallbackState.user };
    }

    if (!window.state.lib || typeof window.state.lib !== 'object') {
      window.state.lib = { ...fallbackState.lib };
    }

    if (!window.state.peerUsed || typeof window.state.peerUsed !== 'object') {
      window.state.peerUsed = { ...fallbackState.peerUsed };
    }

    return window.state;
  }

  window.supabaseAuth = (() => {
    const config = window.BRAINSTEIN_CONFIG || {};
    const SUPABASE_URL = safeText(config.supabaseUrl, 'https://YOUR_PROJECT_REF.supabase.co');
    const SUPABASE_ANON_KEY = safeText(config.supabaseAnonKey, 'YOUR_SUPABASE_ANON_KEY');

    const client = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        })
      : null;

    function normalizeUser(sessionUser) {
      if (!sessionUser) {
        return {
          name: 'Guest Observer',
          handle: 'guest-observer',
          signed: false,
          avatar: 'G',
          email: ''
        };
      }

      const metadata = sessionUser.user_metadata || {};
      const fullName = safeText(
        metadata.full_name || metadata.name || sessionUser.email?.split('@')[0] || 'User',
        'User'
      );
      const handleBase = safeText(
        (metadata.user_name || sessionUser.email || 'user')
          .split('@')[0]
          .replace(/[^a-z0-9-]/gi, '-')
          .toLowerCase(),
        'user'
      );

      return {
        name: fullName,
        handle: handleBase,
        signed: true,
        avatar: fullName.charAt(0).toUpperCase(),
        email: sessionUser.email || '',
        photoURL: metadata.avatar_url || metadata.picture || '',
        uid: sessionUser.id || ''
      };
    }

    function syncUserFromSession(sessionUser) {
      const baseState = ensureBaseState();
      baseState.user = normalizeUser(sessionUser);
      window.state = baseState;
      if (typeof window.updateAuthUI === 'function') window.updateAuthUI();
    }

    function getAuthRedirectUrl() {
      const url = new URL(window.location.href);
      url.hash = '';
      url.search = '';
      url.searchParams.set('auth', 'callback');
      return url.toString();
    }

    async function signUp(email, password) {
      if (!client) throw new Error('Supabase client is not initialized');

      const cleanEmail = safeText(email, '').toLowerCase();
      const cleanPassword = safeText(password, '');

      if (!cleanEmail || !cleanEmail.includes('@')) throw new Error('Please enter a valid email.');
      if (cleanPassword.length < 6) throw new Error('Password must be at least 6 characters.');

      const { data, error } = await client.auth.signUp({ email: cleanEmail, password: cleanPassword });
      if (error) throw error;
      if (data?.session?.user) syncUserFromSession(data.session.user);
      return data;
    }

    async function signIn(email, password) {
      if (!client) throw new Error('Supabase client is not initialized');

      const cleanEmail = safeText(email, '').toLowerCase();
      const cleanPassword = safeText(password, '');

      if (!cleanEmail || !cleanEmail.includes('@')) throw new Error('Please enter a valid email.');
      if (cleanPassword.length < 6) throw new Error('Password must be at least 6 characters.');

      const { data, error } = await client.auth.signInWithPassword({
        email: cleanEmail,
        password: cleanPassword
      });

      if (error) throw error;
      if (data?.user) syncUserFromSession(data.user);
      return data;
    }

    async function signInWithGoogle() {
      if (!client) throw new Error('Supabase client is not initialized');

      const { data, error } = await client.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: getAuthRedirectUrl() }
      });

      if (error) throw error;
      return data;
    }

    async function signOut() {
      if (!client) {
        syncUserFromSession(null);
        return;
      }

      const { error } = await client.auth.signOut();
      if (error) throw error;
      syncUserFromSession(null);
    }

    async function hydrate() {
      ensureBaseState();

      if (!client) {
        syncUserFromSession(null);
        return;
      }

      try {
        const { data: { session }, error } = await client.auth.getSession();
        if (error) {
          console.error('Supabase session error:', error);
          syncUserFromSession(null);
          return;
        }

        syncUserFromSession(session?.user || null);

        client.auth.onAuthStateChange((_event, nextSession) => {
          syncUserFromSession(nextSession?.user || null);
        });
      } catch (error) {
        console.error('Supabase session hydration failed:', error);
        syncUserFromSession(null);
      }
    }

    return {
      client,
      hydrate,
      signIn,
      signUp,
      signInWithGoogle,
      signOut,
      syncUserFromSession,
      normalizeUser
    };
  })();

  window.updateAuthUI = function () {
    const baseState = ensureBaseState();
    const user = baseState.user && typeof baseState.user === 'object'
      ? baseState.user
      : {
          name: 'Guest Observer',
          handle: 'guest-observer',
          signed: false,
          avatar: 'G',
          email: ''
        };

    const loginButton = document.querySelector('[data-auth="login"]');
    const signupButton = document.querySelector('[data-auth="signup"]');
    const userChip = document.getElementById('userChip');
    const chipName = document.getElementById('chipName');
    const chipAv = document.getElementById('chipAv');
    const popName = document.getElementById('popName');
    const popHdl = document.getElementById('popHdl');
    const popAv = document.getElementById('popAv');

    if (user.signed) {
      if (loginButton) loginButton.style.display = 'none';
      if (signupButton) signupButton.style.display = 'none';
      if (userChip) userChip.classList.add('on');
      if (chipName) chipName.textContent = user.name;
      if (chipAv) chipAv.textContent = (user.name || 'G').charAt(0).toUpperCase();
      if (popName) popName.textContent = user.name;
      if (popHdl) popHdl.textContent = '@' + (user.handle || 'user');
      if (popAv) popAv.textContent = (user.name || 'G').charAt(0).toUpperCase();
    } else {
      if (loginButton) loginButton.style.display = '';
      if (signupButton) signupButton.style.display = '';
      if (userChip) userChip.classList.remove('on');
      if (chipName) chipName.textContent = 'Guest';
      if (chipAv) chipAv.textContent = 'G';
      if (popName) popName.textContent = 'Guest Observer';
      if (popHdl) popHdl.textContent = '@guest-observer';
      if (popAv) popAv.textContent = 'G';
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    ensureBaseState();

    const googleBtn = document.querySelector('[data-oauth="Google"]');
    if (googleBtn) {
      googleBtn.dataset.originalText = googleBtn.dataset.originalText || googleBtn.textContent;
      googleBtn.addEventListener('click', async () => {
        try {
          googleBtn.disabled = true;
          googleBtn.textContent = 'Connecting…';
          await window.supabaseAuth.signInWithGoogle();
          const authOverlay = document.getElementById('ovAuth');
          if (authOverlay) authOverlay.classList.remove('open');
          toast('Signed in with Google', 'check');
        } catch (error) {
          console.error('Google auth failed:', error);
          toast(error?.message || 'Google sign-in failed', 'alert-circle');
        } finally {
          googleBtn.disabled = false;
          googleBtn.textContent = googleBtn.dataset.originalText || 'Google';
        }
      });
    }

    const authTabs = document.querySelectorAll('.au-tabs button');
    authTabs.forEach((button) => {
      button.addEventListener('click', () => {
        authTabs.forEach((btn) => btn.classList.toggle('on', btn === button));
        const mode = button.dataset.tab || button.textContent?.trim().toLowerCase() || 'signup';
        const submitButton = document.querySelector('[data-auth-submit]') || document.getElementById('auSubmit');
        if (submitButton) {
          submitButton.textContent = mode === 'login' ? 'Log in' : 'Create account';
        }
      });
    });

    const submitButton = document.querySelector('[data-auth-submit]') || document.getElementById('auSubmit');
    if (submitButton) {
      submitButton.addEventListener('click', async () => {
        const emailInput = document.getElementById('auEmail') || document.querySelector('input[name="email"]');
        const passwordInput = document.getElementById('auPass') || document.querySelector('input[name="password"]');
        const selectedTab = document.querySelector('.au-tabs button.on') || document.querySelector('[data-tab="signup"]') || document.querySelector('[data-tab="login"]');
        const mode = (selectedTab && (selectedTab.dataset.tab || selectedTab.textContent || '')).toLowerCase() || 'signup';

        const email = emailInput ? emailInput.value : '';
        const password = passwordInput ? passwordInput.value : '';

        try {
          submitButton.disabled = true;
          submitButton.textContent = mode === 'login' ? 'Logging in…' : 'Creating account…';

          if (mode === 'login') {
            await window.supabaseAuth.signIn(email, password);
            toast('Signed in successfully', 'check');
          } else {
            const data = await window.supabaseAuth.signUp(email, password);
            if (data?.user && !data.session) {
              toast('Verification email sent. Check your inbox.', 'mail');
            } else {
              toast('Account created successfully', 'check');
            }
          }

          const authOverlay = document.getElementById('ovAuth');
          if (authOverlay) authOverlay.classList.remove('open');
        } catch (error) {
          console.error('Auth submit failed:', error);
          toast(error?.message || 'Authentication failed', 'alert-circle');
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = mode === 'login' ? 'Log in' : 'Create account';
        }
      });
    }

    const userChip = document.getElementById('userChip');
    if (userChip) {
      userChip.addEventListener('click', async () => {
        const currentUser = ensureBaseState().user;
        if (!currentUser || !currentUser.signed) return;
        const shouldLogout = confirm(`Sign out ${currentUser.name}?`);
        if (!shouldLogout) return;

        try {
          await window.supabaseAuth.signOut();
          const profilePop = document.getElementById('profilePop');
          if (profilePop) profilePop.classList.remove('open');
          toast('Signed out', 'check');
        } catch (error) {
          console.error('Sign-out failed:', error);
          toast('Could not sign out', 'alert-circle');
        }
      });
    }

    if (window.supabaseAuth && typeof window.supabaseAuth.hydrate === 'function') {
      window.supabaseAuth.hydrate().catch((error) => {
        console.error('Supabase auth hydration failed:', error);
        window.supabaseAuth.syncUserFromSession(null);
      });
    }

    if (typeof window.updateAuthUI === 'function') window.updateAuthUI();
  });
</script>
